<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>

<body class="{% if page.url == '/' %}home-page{% endif %}">
  {% include header.html %}

  <!-- On home page: plain <main> (full width for GIF)
       On other pages: <main class="page-main"> (centered column) -->
  <main class="{% if page.url != '/' %}page-main{% endif %}">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
